[package]
name = "iac-forge"
version = "0.1.4"
edition = "2024"
rust-version = "1.89.0"
description = "Platform-independent infrastructure-as-code generator from OpenAPI specs"
homepage = "https://github.com/pleme-io/iac-forge"
repository = "https://github.com/pleme-io/iac-forge"
documentation = "https://docs.rs/iac-forge"
readme = "README.md"
license = "MIT"
# `code-generators` is NOT a crates.io category slug and the registry rejects
# the whole release for it — 400 Bad Request, "The following category slugs are
# not currently supported". It reads plausible, which is why it survived: the
# field is never validated locally, only at upload, so this crate built and
# tested clean forever while being unreleasable. `codegen` stays as a KEYWORD
# below, which is free-form and does express the same thing.
categories = ["development-tools"]
keywords = ["iac", "codegen", "openapi", "terraform", "pulumi"]

[lints.clippy]
pedantic = "warn"

[features]
default = []
# Rust-level sui (pure-Rust Nix) integration — evaluates Nix transforms
# in-process rather than shelling out. Pulls in the full sui-eval crate.
# Named sui-eval (not just "sui") to avoid ambiguity with the sui package
# in cargo's --features resolution.
sui-eval = ["dep:sui-eval"]

[dependencies]
blake3 = "1.8"
meimei = "0.1"
openapi-forge = "0.1"
takumi = { package = "pleme-io-takumi", version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sui-eval = { version = "0.1", optional = true }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
